apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: go-app
type: Opaque
stringData:
  GF_ADMIN_USER: admin
  GF_ADMIN_PASSWORD: GrafanaAdmin123
# Dev password, committed like the other cluster secrets. Change it
# (kubectl edit secret grafana-secret + rollout restart deployment/grafana)
# before exposing Grafana beyond localhost.