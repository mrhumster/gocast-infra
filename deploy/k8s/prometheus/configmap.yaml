apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: go-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              job: prometheus

      # Pod-discovery по аннотациям prometheus.io/* в неймспейсе go-app.
      # Новый сервис = добавил аннотацию на под = подхватился автоматически.
      - job_name: 'go-app-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['go-app']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: '(.+)'
            replacement: '$1'
            target_label: __metrics_path__
          - action: labelmap
            regex: '__meta_kubernetes_pod_label_(.+)'
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # MinIO отдаёт свои метрики на :9000/minio/prometheus/metrics
      # (MINIO_PROMETHEUS_AUTH_TYPE=public в minio-config).
      - job_name: 'minio'
        metrics_path: /minio/prometheus/metrics
        static_configs:
          - targets: ['minio.go-app.svc.cluster.local:9000']
            labels:
              job: minio